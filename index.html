<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8e3b6e"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>Moje kosmetyki</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fbf4f8;color:#2b1a24;font-size:18px}
header{background:#8e3b6e;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}#count{font-size:14px;opacity:.85}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px;background:#f1dbe8;position:sticky;top:58px;z-index:4}
nav button{flex:0 0 auto;border:0;border-radius:22px;padding:12px 16px;font-size:17px;background:#fff;color:#8e3b6e}
nav button.on{background:#8e3b6e;color:#fff}
main{padding:10px 10px 110px}.sub{margin:14px 4px 6px;font-weight:700;color:#8e3b6e}
.card{display:flex;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.card{flex-wrap:wrap}.pics{display:flex;gap:8px;flex:1 1 100%}.pics img{flex:1 1 0;min-width:0;max-width:50%;height:220px;object-fit:contain;border-radius:10px;background:#f4eef1}.txt{flex:1 1 100%}
@media(min-width:700px){.card{flex-wrap:nowrap}.pics{flex:0 0 340px}.txt{flex:1}}
.card h3{margin:0 0 4px;font-size:18px}.meta{font-size:15px;color:#6b4a5c}.note{font-size:15px;margin-top:4px;white-space:pre-line}
.big{display:block;width:100%;padding:16px;font-size:19px;border:0;border-radius:14px;background:#8e3b6e;color:#fff;margin:8px 0}
.big.alt{background:#fff;color:#8e3b6e;border:2px solid #8e3b6e}.big.del{background:#c0392b}
#fab{position:fixed;right:18px;bottom:22px;width:68px;height:68px;border-radius:50%;font-size:38px;border:0;background:#8e3b6e;color:#fff;box-shadow:0 3px 8px #0004}
dialog{width:min(560px,96vw);border:0;border-radius:16px;padding:16px}label{display:block;margin-top:10px;font-size:15px;color:#6b4a5c}
input,textarea,select{width:100%;font-size:18px;padding:12px;border:1px solid #d6b5c8;border-radius:10px}textarea{min-height:90px}
.prev{display:flex;gap:8px;margin-top:6px}img[src='']{display:none}.prev img{width:48%;height:200px;object-fit:contain;border-radius:10px;background:#eee}
#search{width:100%;margin-bottom:8px}.face img{width:100%;border-radius:14px;margin-bottom:10px}
#full{padding:0;background:#000;max-width:100vw;max-height:100vh;width:100vw;height:100vh}#full img{width:100%;height:100%;object-fit:contain;display:block}
.pick{display:block;text-align:center;padding:14px;border:2px dashed #8e3b6e;border-radius:12px;color:#8e3b6e;font-size:17px;margin-top:8px}
</style></head><body>
<header><h1>💄 Moje kosmetyki</h1><div id="count"></div></header>
<nav id="tabs"></nav><main id="list"></main>
<button id="fab" aria-label="Dodaj">+</button>
<dialog id="ed"><form method="dialog" id="f">
<h2 id="edt">Kosmetyk</h2>
<label>Kategoria<select name="kategoria" id="fk"></select></label>
<label>Podgrupa (opcjonalnie)<input name="podgrupa"></label>
<label>Nazwa<input name="nazwa" required></label>
<label>Zastosowanie<input name="zastosowanie"></label>
<label>Kolor / odcienie<textarea name="kolor"></textarea></label>
<label>Uwagi<textarea name="uwagi"></textarea></label>
<div class="prev"><img id="v1"><img id="v2"></div>
<label class="pick">📷 Zdjęcie produktu – wybierz nowe, żeby wymienić<input type="file" accept="image/*" id="p1" style="display:none"></label>
<label class="pick"><span id="l2">Swatch</span><input type="file" accept="image/*" id="p2" style="display:none"></label>
<p class="meta">Wymiana zdjęcia nie zmienia pozostałych pól. Zapisz, żeby zatwierdzić.</p>
<button class="big" value="save">Zapisz</button>
<button class="big alt" value="cancel" formnovalidate>Anuluj</button>
<button class="big del" type="button" id="del">Usuń</button>
</form></dialog>
<dialog id="full" onclick="this.close()"><img id="fullimg"></dialog>
<script src="seed.js"></script><script src="app.js"></script></body></html>
